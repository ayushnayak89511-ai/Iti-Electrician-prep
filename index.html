<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITI Electrician Prep</title>
<style>
:root{--bg:#f1f3f6;--card:#fff;--ink:#101820;--mute:#586577;--line:#d8dee6;--acc:#f2b800;--accInk:#1a1400;--ok:#1e8e4e;--bad:#d23b3b;--blue:#1b4fd8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1117;--card:#151c25;--ink:#e9eef4;--mute:#93a1b2;--line:#263140;--acc:#ffc933;--ok:#4cc47f;--bad:#ff6b6b;--blue:#7fa2ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1117;--card:#151c25;--ink:#e9eef4;--mute:#93a1b2;--line:#263140;--acc:#ffc933;--ok:#4cc47f;--bad:#ff6b6b;--blue:#7fa2ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{background:var(--card);padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);font-size:.85rem}
.stripe{height:4px;background:linear-gradient(90deg,#d62828 33.3%,#f2b800 33.3% 66.6%,#1b4fd8 66.6%)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:12px 14px;cursor:pointer;border-bottom:3px solid transparent}
nav button[aria-current=true]{color:var(--ink);border-bottom-color:var(--acc)}
button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:16px 14px 48px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
details.card{padding:0}
summary{padding:14px;font-weight:600;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line)}
details .in{padding:6px 14px 12px}
ul,ol{margin:6px 0;padding-left:20px}li{margin:6px 0}
.tools{color:var(--mute);font-size:.9rem}
.warn{border-left:4px solid var(--acc);padding:6px 10px;margin:10px 0 4px;background:color-mix(in srgb,var(--acc) 14%,transparent)}
input[type=search],select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:12px}
.f{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.f b{font-weight:600}.f code{font:600 1rem ui-monospace,Menlo,monospace;color:var(--blue)}
.tag{font-size:.8rem;color:var(--mute)}
svg{width:100%;height:auto;display:block;color:var(--ink)}
svg *{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg rect.r{fill:var(--card)}svg rect.c{fill:color-mix(in srgb,var(--acc) 45%,transparent)}
svg text{fill:currentColor;stroke:none;font:12px system-ui}
figcaption{color:var(--mute);font-size:.9rem;margin-top:6px}
figure{margin:0}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,transparent)}
.exp{margin-top:10px;color:var(--mute);font-size:.92rem}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.p{background:var(--acc);color:var(--accInk);border-color:transparent}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-bottom:12px}
.pal button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 0;cursor:pointer}
.pal .a{background:var(--ok);color:#fff;border-color:transparent}.pal .m{background:var(--acc);color:var(--accInk);border-color:transparent}.pal .cur{outline:2px solid var(--blue)}
.big{font-size:2.6rem;font-weight:700;line-height:1.1}
</style>
</head>
<body>
<header><div><h1>ITI Electrician Prep</h1><p>Theory, practical, formulas, MCQs and CBT mock test</p></div><button class="btn" id="th" type="button">Dark</button></header>
<div class="stripe"></div>
<nav id="nav" aria-label="Sections"></nav>
<main>
<section id="learn"></section>
<section id="formulas" hidden><input type="search" id="fq" placeholder="Search formulas, e.g. power, star, slip" aria-label="Search formulas"><div id="fl"></div></section>
<section id="diagrams" hidden>
<div class="card"><figure><svg viewBox="0 0 300 130" role="img" aria-label="Series circuit"><path d="M40 25H100M140 25H180M220 25H260V105H40V70M40 55V25M28 55H52M34 70H46"/><rect class="r" x="100" y="19" width="40" height="12"/><rect class="r" x="180" y="19" width="40" height="12"/><text x="112" y="14">R₁</text><text x="192" y="14">R₂</text><text x="100" y="125">I same everywhere</text></svg><figcaption><b>Series circuit.</b> One path: same current, voltages add, R = R₁ + R₂.</figcaption></figure></div>
<div class="card"><figure><svg viewBox="0 0 300 130" role="img" aria-label="Parallel circuit"><path d="M40 20H250V110H40V70M40 55V20M28 55H52M34 70H46M130 20V45M130 85V110M210 20V45M210 85V110"/><rect class="r" x="124" y="45" width="12" height="40"/><rect class="r" x="204" y="45" width="12" height="40"/><text x="142" y="70">R₁</text><text x="222" y="70">R₂</text></svg><figcaption><b>Parallel circuit.</b> Same voltage across each branch, currents add, 1/R = 1/R₁ + 1/R₂.</figcaption></figure></div>
<div class="card"><figure><svg viewBox="0 0 300 120" role="img" aria-label="Star and delta connection"><path d="M75 65V15M75 65L32 95M75 65L118 95M230 20L187 100H273Z"/><text x="70" y="11">L1</text><text x="14" y="108">L2</text><text x="112" y="110">L3</text><text x="82" y="68">N</text><text x="224" y="14">L1</text><text x="170" y="112">L2</text><text x="268" y="114">L3</text><text x="40" y="12">Star</text><text x="150" y="14">Delta</text></svg><figcaption><b>Star:</b> V<sub>L</sub> = √3 V<sub>ph</sub>, I<sub>L</sub> = I<sub>ph</sub>. <b>Delta:</b> V<sub>L</sub> = V<sub>ph</sub>, I<sub>L</sub> = √3 I<sub>ph</sub>.</figcaption></figure></div>
<div class="card"><figure><svg viewBox="0 0 300 130" role="img" aria-label="Transformer"><path d="M110 20H190V110H110Z M20 65H96M204 65H280"/><rect class="c" x="96" y="38" width="28" height="54"/><rect class="c" x="176" y="38" width="28" height="54"/><text x="30" y="58">V₁ in</text><text x="236" y="58">V₂ out</text><text x="84" y="108">N₁</text><text x="206" y="108">N₂</text><text x="125" y="70">Core</text></svg><figcaption><b>Single-phase transformer.</b> Primary N₁ and secondary N₂ on a laminated core: V₁/V₂ = N₁/N₂.</figcaption></figure></div>
</section>
<section id="practical" hidden></section>
<section id="mcq" hidden><select id="ts" aria-label="Topic"></select><p class="tag" id="sc"></p><div id="ql"></div></section>
<section id="cbt" hidden></section>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var THEORY=[
["Electrical basics",["Current is flow of charge (ampere), voltage is potential difference (volt), resistance opposes current (ohm).","Ohm’s law: at constant temperature, current is directly proportional to voltage.","KCL: current entering a junction equals current leaving. KVL: sum of voltages around a closed loop is zero.","Series circuit has one path and the same current. Parallel circuit has a common voltage and shared current."]],
["Magnetism and induction",["Fleming’s left-hand rule gives the force direction in a motor. Right-hand rule gives induced emf direction in a generator.","Faraday: induced emf is proportional to the rate of change of flux linkage.","Lenz’s law: induced current opposes the change that produces it.","Self-induction acts in one coil; mutual induction links two coils."]],
["AC fundamentals",["India supplies 230 V single phase, 415 V three phase at 50 Hz.","RMS = 0.707 × peak. Average = 0.637 × peak.","Resistor: V and I in phase. Inductor: current lags 90°. Capacitor: current leads 90°.","Power factor is cos φ. Low power factor raises current and losses; capacitors improve it."]],
["Transformer",["Static device that transfers energy between circuits by mutual induction, with no change of frequency.","Laminated silicon-steel core reduces eddy current loss. Iron loss is constant; copper loss varies with load.","Step-up: more secondary turns. Step-down: fewer secondary turns.","Large oil-filled units use a Buchholz relay to detect internal faults."]],
["Motors and generators",["A DC motor develops back emf, which limits armature current. A starter is needed because starting current is very high.","A 3-phase induction motor runs below synchronous speed. Slip is 1 (100%) at start.","Swap any two supply lines to reverse a 3-phase induction motor.","Starters reduce starting current: DOL (small motors), star-delta, auto-transformer."]],
["Wiring, safety and earthing",["Choose conductor size by current rating and voltage drop. Fuse and MCB protect against overload and short circuit. RCCB/ELCB protects against earth leakage.","Earthing lets fault current flow safely to ground so the protective device trips.","Test insulation with a megger and earth resistance with an earth tester.","Isolate, lock out and test dead before work. For electrical fires use CO₂ or dry powder, never water."]]];
var FORM=[
["Ohm’s law","V = I × R","Basics"],["Electric power","P = V I = I²R = V²/R","Basics"],["Energy","E = P × t  (kWh = kW × hours)","Basics"],["Resistance of a wire","R = ρL / A","Basics"],["Series resistors","R = R₁ + R₂ + R₃","Basics"],["Parallel resistors","1/R = 1/R₁ + 1/R₂ + 1/R₃","Basics"],["Capacitors in series","1/C = 1/C₁ + 1/C₂","Basics"],
["Inductive reactance","X_L = 2πfL","AC"],["Capacitive reactance","X_C = 1 / (2πfC)","AC"],["Impedance (series RL)","Z = √(R² + X²)","AC"],["Power factor","cos φ = R/Z = P/S","AC"],["RMS value","V_rms = V_peak / √2 = 0.707 V_peak","AC"],["3-phase power","P = √3 V_L I_L cos φ","AC"],["Star connection","V_L = √3 V_ph, I_L = I_ph","3-phase"],["Delta connection","V_L = V_ph, I_L = √3 I_ph","3-phase"],
["Transformer ratio","V₁/V₂ = N₁/N₂ = I₂/I₁","Machines"],["Transformer emf","E = 4.44 f N Φm","Machines"],["Efficiency","η = (output / input) × 100","Machines"],["Synchronous speed","Ns = 120 f / P","Machines"],["Slip","s = (Ns − N) / Ns","Machines"],["DC motor back emf","E_b = V − I_a R_a","Machines"]];
var JOBS=[
["Two-way staircase lamp","Two 2-way switches, lamp, wire, tester",["Switch off the MCB and test dead.","Connect phase to the common terminal of switch 1.","Join the two strapper terminals of switch 1 to those of switch 2.","Connect the common of switch 2 to the lamp, then the lamp to neutral.","Energise and check the lamp toggles from both switches."]],
["Fluorescent tube light","Tube, choke, starter, holders, switch",["Isolate the supply.","Connect phase through the switch to the choke.","Connect the choke to one end of filament 1.","Connect the other end of filament 1 to the starter, and the starter to one end of filament 2.","Connect the remaining end of filament 2 to neutral.","Energise: starter glows, then the tube strikes."]],
["DOL starter for a 3-phase motor","Contactor, overload relay, start/stop buttons, MCB",["Connect R, Y, B through the MCB to the contactor main contacts.","Take the outputs through the overload relay to motor U, V, W.","Control circuit: phase, stop (NC), start (NO) with the contactor hold-on contact in parallel, overload NC contact, then coil to neutral.","Set the overload relay to the motor’s rated current.","Test the control circuit with the motor disconnected first."]],
["Star-delta starter","Three contactors, timer, overload relay",["Main contactor connects the supply to U1, V1, W1.","Star contactor joins U2, V2, W2 together.","Delta contactor joins U1–W2, V1–U2, W1–V2.","Timer drops out star and pulls in delta after a few seconds.","Interlock star and delta contactors so both can never close together."]],
["Insulation test with a megger","Megger (500 V), leads, tester",["Isolate, discharge and disconnect the load.","Check the megger: leads open reads infinity, leads shorted reads zero.","Connect between conductor and earth, then between phase and neutral.","Turn the handle steadily and note the reading.","Commonly at least 1 MΩ is expected; lower readings need investigation."]]];
var Q=[
["Basics","Unit of electrical resistance is","Ohm|Henry|Farad|Siemens",0,"Resistance is measured in ohm (Ω)."],
["Basics","Three 6 Ω resistors in parallel give","18 Ω|6 Ω|2 Ω|0.5 Ω",2,"R = 6/3 = 2 Ω."],
["Basics","Power used by 230 V, 5 A load is","46 W|1150 W|235 W|225 W",1,"P = V × I = 230 × 5 = 1150 W."],
["Basics","Kirchhoff’s current law is based on conservation of","Charge|Energy|Momentum|Mass",0,"Charge entering a junction equals charge leaving."],
["Basics","Two capacitors of 4 µF and 6 µF in series give","10 µF|5 µF|2.4 µF|24 µF",2,"(4 × 6)/(4 + 6) = 2.4 µF."],
["AC","Frequency of Indian AC supply is","25 Hz|50 Hz|60 Hz|100 Hz",1,"India uses 50 Hz."],
["AC","RMS value of a sine wave with 325 V peak is about","163 V|230 V|325 V|460 V",1,"325 / 1.414 ≈ 230 V."],
["AC","Power factor of a pure inductor is","Zero|1|0.5|0.8",0,"Current lags by 90°, so cos 90° = 0."],
["AC","In star connection, line voltage equals","Phase voltage|√3 × phase voltage|Phase voltage / √3|3 × phase voltage",1,"V_L = √3 V_ph in star."],
["Magnetism","Fleming’s right-hand rule gives direction of","Force on a conductor|Induced emf|Magnetic flux|Torque",1,"It is used for generators."],
["Magnetism","Direction of induced current opposing its cause is stated by","Ohm’s law|Lenz’s law|Coulomb’s law|Joule’s law",1,"Lenz’s law."],
["Transformer","A transformer works on the principle of","Self induction|Mutual induction|Static charge|Hall effect",1,"Two coils linked by a common flux."],
["Transformer","Loss that stays constant from no load to full load is","Copper loss|Iron loss|Both|Friction loss",1,"Iron loss depends on voltage and frequency, not load."],
["Machines","Synchronous speed of a 4-pole motor on 50 Hz is","3000 rpm|1500 rpm|1000 rpm|750 rpm",1,"Ns = 120 × 50 / 4 = 1500 rpm."],
["Machines","Slip of an induction motor at start is","0|0.5|1|0.05",2,"Rotor is at rest, so slip = 1."],
["Machines","Star-delta starter reduces starting current by starting the motor in","Delta|Star|Series|Parallel",1,"Star gives phase voltage = V_L/√3."],
["Safety","MCB protects against","Overload only|Short circuit only|Overload and short circuit|Earth leakage only",2,"MCB has thermal and magnetic trips."],
["Safety","Instrument used to measure insulation resistance is","Ammeter|Megger|Wattmeter|Tachometer",1,"A megger applies high DC voltage."],
["Safety","Ammeter is connected in","Parallel|Series|Either|Across supply",1,"It must carry the circuit current."],
["Safety","Fire extinguisher for an electrical fire is","Water|Foam|CO₂|Soda acid",2,"CO₂ or dry powder is non-conductive."]];
var TABS=[["learn","Theory"],["formulas","Formulas"],["diagrams","Diagrams"],["practical","Practical"],["mcq","MCQ practice"],["cbt","CBT mock test"]];
var nav=$("#nav");
TABS.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.dataset.t=t[0];b.type="button";nav.appendChild(b)});
function show(id){
  TABS.forEach(function(t){$("#"+t[0]).hidden=t[0]!==id});
  [].forEach.call(nav.children,function(b){b.setAttribute("aria-current",b.dataset.t===id)});
  window.scrollTo(0,0);
}
nav.addEventListener("click",function(e){if(e.target.dataset.t)show(e.target.dataset.t)});

$("#learn").innerHTML=THEORY.map(function(x,i){return '<details class="card"'+(i===0?" open":"")+'><summary>'+x[0]+'</summary><div class="in"><ul>'+x[1].map(function(p){return "<li>"+p+"</li>"}).join("")+"</ul></div></details>"}).join("");
$("#practical").innerHTML=JOBS.map(function(j){return '<details class="card"><summary>'+j[0]+'</summary><div class="in"><p class="tools">Needs: '+j[1]+"</p><ol>"+j[2].map(function(s){return "<li>"+s+"</li>"}).join("")+'</ol><div class="warn">Switch off, isolate and test dead before touching any wiring.</div></div></details>'}).join("");

function drawF(q){
  q=(q||"").toLowerCase();
  $("#fl").innerHTML=FORM.filter(function(f){return (f.join(" ")).toLowerCase().indexOf(q)>-1}).map(function(f){return '<div class="card"><div class="f"><b>'+f[0]+"</b><span class=tag>"+f[2]+"</span></div><code>"+f[1]+"</code></div>"}).join("")||'<p class="tag">No formula found.</p>';
}
$("#fq").addEventListener("input",function(){drawF(this.value)});drawF();

/* MCQ practice */
var topics=["All topics"].concat(Q.map(function(q){return q[0]}).filter(function(v,i,a){return a.indexOf(v)===i}));
$("#ts").innerHTML=topics.map(function(t){return "<option>"+t+"</option>"}).join("");
var done=0,right=0,cur=[];
function drawQ(){
  var t=$("#ts").value;cur=Q.filter(function(q){return t==="All topics"||q[0]===t});done=0;right=0;
  $("#ql").innerHTML=cur.map(function(q,i){return '<div class="card" data-i="'+i+'"><b>'+(i+1)+". "+q[1]+"?</b>"+q[2].split("|").map(function(o,k){return '<button class="opt" type="button" data-k="'+k+'">'+o+"</button>"}).join("")+'<div class="exp" hidden>'+q[4]+"</div></div>"}).join("");
  score();
}
function score(){$("#sc").textContent="Answered "+done+" of "+cur.length+" · Correct "+right}
$("#ts").addEventListener("change",drawQ);
$("#ql").addEventListener("click",function(e){
  var o=e.target.closest(".opt");if(!o)return;
  var c=o.closest(".card");if(c.dataset.d)return;c.dataset.d=1;
  var q=cur[+c.dataset.i],k=+o.dataset.k;
  [].forEach.call(c.querySelectorAll(".opt"),function(b){if(+b.dataset.k===q[3])b.classList.add("ok")});
  if(k!==q[3])o.classList.add("bad");else right++;
  done++;c.querySelector(".exp").hidden=false;score();
});
drawQ();

/* CBT mock test */
var S=null,tm=null,TOTAL=20*60;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function best(){try{return localStorage.getItem("itiBest")}catch(e){return null}}
function intro(){
  var b=best();
  $("#cbt").innerHTML='<div class="card"><h2 style="margin-top:0">CBT mock test</h2><ul><li>'+Q.length+" questions, 20 minutes, one mark each, no negative marking.</li><li>Move freely between questions, mark for review, and submit when ready.</li><li>The test submits itself when time runs out.</li></ul>"+(b?'<p class="tag">Your best score: '+b+"</p>":"")+'<button class="btn p" id="go" type="button">Start test</button></div>';
  $("#go").onclick=start;
}
function start(){S={qs:shuffle(Q),a:[],m:[],i:0,left:TOTAL,sure:false};S.qs.forEach(function(_,i){S.a[i]=-1});clearInterval(tm);tm=setInterval(tick,1000);paint()}
function fmt(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function tick(){S.left--;var e=$("#tt");if(e)e.textContent=fmt(S.left);if(S.left<=0)finish()}
function paint(){
  var q=S.qs[S.i];
  $("#cbt").innerHTML='<div class="top"><span>Question '+(S.i+1)+" of "+S.qs.length+'</span><span id="tt">'+fmt(S.left)+'</span></div><div class="pal">'+S.qs.map(function(_,i){return '<button type="button" data-p="'+i+'" class="'+(S.m[i]?"m":S.a[i]>-1?"a":"")+(i===S.i?" cur":"")+'" aria-label="Question '+(i+1)+'">'+(i+1)+"</button>"}).join("")+'</div><div class="card"><b>'+q[1]+"?</b>"+q[2].split("|").map(function(o,k){return '<button type="button" class="opt'+(S.a[S.i]===k?" sel":"")+'" data-o="'+k+'">'+o+"</button>"}).join("")+'</div><div class="bar"><button class="btn" data-x="prev" type="button">Previous</button><button class="btn" data-x="next" type="button">Next</button><button class="btn" data-x="mark" type="button">'+(S.m[S.i]?"Unmark":"Mark for review")+'</button><button class="btn" data-x="clear" type="button">Clear answer</button><button class="btn p" data-x="sub" type="button">'+(S.sure?"Tap again to submit":"Submit test")+"</button></div>";
}
$("#cbt").addEventListener("click",function(e){
  if(!S||S.over)return;var t=e.target;
  if(t.dataset.p!==undefined){S.i=+t.dataset.p;S.sure=false;paint()}
  else if(t.dataset.o!==undefined){S.a[S.i]=+t.dataset.o;S.sure=false;paint()}
  else if(t.dataset.x){var x=t.dataset.x;
    if(x==="next"&&S.i<S.qs.length-1)S.i++;
    if(x==="prev"&&S.i>0)S.i--;
    if(x==="mark")S.m[S.i]=!S.m[S.i];
    if(x==="clear")S.a[S.i]=-1;
    if(x==="sub"){if(S.sure){finish();return}S.sure=true;paint();return}
    S.sure=false;paint()}
});
function finish(){
  clearInterval(tm);S.over=true;
  var c=0,w=0,u=0,by={};
  S.qs.forEach(function(q,i){var r=S.a[i]===-1?"u":S.a[i]===q[3]?"c":"w";if(r==="c")c++;else if(r==="w")w++;else u++;by[q[0]]=by[q[0]]||[0,0];by[q[0]][1]++;if(r==="c")by[q[0]][0]++});
  var n=S.qs.length,pct=Math.round(c/n*100);
  try{var b=parseInt(best());if(isNaN(b)||c>b)localStorage.setItem("itiBest",c+" / "+n)}catch(e){}
  $("#cbt").innerHTML='<div class="card"><div class="tag">Your score</div><div class="big">'+c+" / "+n+'</div><p>'+pct+"% · Correct "+c+" · Wrong "+w+" · Skipped "+u+"</p><ul>"+Object.keys(by).map(function(k){return "<li>"+k+": "+by[k][0]+" of "+by[k][1]+"</li>"}).join("")+'</ul><button class="btn p" id="again" type="button">Take another test</button></div><h2>Review</h2>'+S.qs.map(function(q,i){var o=q[2].split("|");return '<div class="card"><b>'+(i+1)+". "+q[1]+"?</b><p>Your answer: "+(S.a[i]>-1?o[S.a[i]]:"not attempted")+"<br>Correct answer: "+o[q[3]]+'</p><div class="exp">'+q[4]+"</div></div>"}).join("");
  $("#again").onclick=function(){S=null;intro();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}
intro();

var root=document.documentElement;
function dark(){var t=root.getAttribute("data-theme");return t?t==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function btn(){$("#th").textContent=dark()?"Light":"Dark"}
$("#th").onclick=function(){root.setAttribute("data-theme",dark()?"light":"dark");btn()};
btn();show("learn");
})();
</script>
